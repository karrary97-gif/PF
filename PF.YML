name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Embed bridge key (optional)
        shell: pwsh
        env:
          FP_KEY: ${{ secrets.FP_KEY }}
        run: |
          if ($env:FP_KEY) {
            if ($env:FP_KEY -notmatch '^[0-9a-fA-F]{64}$') { throw "FP_KEY must be 64 hex characters" }
            "KEY = '$($env:FP_KEY)'" | Out-File -Encoding ascii src/embedded_key.py
            Write-Host "Key embedded."
          } else { Write-Host "No FP_KEY secret." }

      - name: Make icon
        run: python tools/make_icon.py

      - name: Build exe
        shell: pwsh
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name FPBridge --icon app.ico
          --paths src
          --collect-submodules zk
          --hidden-import pystray._win32
          --hidden-import embedded_key
          src/app.py

      - uses: actions/upload-artifact@v4
        with:
          name: FPBridge-windows
          path: dist/FPBridge.exe

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FPBridge.exe
